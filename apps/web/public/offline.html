<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1c7ed6" />
    <title>REV Logística · Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8f9fa; color: #212529; }
      main { width: min(420px, calc(100% - 32px)); text-align: center; background: white; border: 1px solid #dee2e6; border-radius: 16px; padding: 32px; box-sizing: border-box; }
      img { width: 150px; max-height: 72px; margin-bottom: 24px; }
      p { color: #6c757d; line-height: 1.5; }
      button { border: 0; border-radius: 8px; padding: 12px 18px; background: #1c7ed6; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/rev-logo-clean.svg" alt="REV Logística" />
      <h1>Sin conexión</h1>
      <p>Los documentos guardados permanecen en este dispositivo y se sincronizarán cuando regrese la conexión.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
