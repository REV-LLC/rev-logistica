name: Retired API delivery listener

# Automatic delivery starts directly on production pushes, concurrently with CI.
# Keep this former listener manual-only so CI completion cannot dispatch a
# second image build. Manual retries use the API image promotion workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Show current delivery entry point
        run: echo "Automatic delivery starts on production push. Use API image promotion for a manual retry."
