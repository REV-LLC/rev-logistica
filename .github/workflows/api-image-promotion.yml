name: API image promotion

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full production commit to build and validate
        required: true
        type: string
      source_ci_run_id:
        description: Successful production CI run for that exact commit
        required: true
        type: string
      allow_initial_git_source:
        description: First migration only; permit Railway-verified recovery to the current Git deployment
        required: false
        default: false
        type: boolean

# Activation is deliberate: configure private GHCR pulls and both environment
# tokens before setting API_IMAGE_PROMOTION_ENABLED=true. This is separate from
# CI; it never removes or replaces either required CI job.
permissions:
  contents: read

concurrency:
  group: api-immutable-image-production
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable API image
    if: vars.API_IMAGE_PROMOTION_ENABLED == 'true' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
      image-repository: ${{ steps.image.outputs.image-repository }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      source-tree: ${{ steps.source.outputs.source-tree }}
      source-ci-run-id: ${{ steps.source.outputs.source-ci-run-id }}
    steps:
      - name: Checkout trusted production definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Set isolated build paths
        run: |
          echo "SOURCE_EVIDENCE_PATH=$RUNNER_TEMP/api-source-evidence.json" >> "$GITHUB_ENV"
          echo "BUILD_EVIDENCE_PATH=$RUNNER_TEMP/api-build-evidence.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/api-docker-config" >> "$GITHUB_ENV"
      - name: Setup isolated BuildKit builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          use: true
          driver-opts: image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe # v0.34.2
          buildkitd-flags: --oci-worker-gc=true
      - name: Test image source and build guards
        run: node --test .github/scripts/api-image-source.test.cjs scripts/deploy/build-api-image.test.cjs scripts/deploy/promote-api-image.test.cjs scripts/deploy/recover-api-image.test.cjs
      - name: Verify production source and bind exact CI run
        id: source
        run: node .github/scripts/api-image-source.cjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
      - name: Authenticate private image publisher
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_USER" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
      - name: Build, smoke test and publish immutable image
        id: image
        run: node scripts/deploy/build-api-image.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      # Build and CI run concurrently. This read-only gate must succeed before
      # the build job can release outputs or either Railway environment starts.
      - name: Require successful CI for the exact image source
        run: node .github/scripts/api-image-source.cjs wait
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
          SOURCE_CI_RUN_ID: ${{ steps.source.outputs.source-ci-run-id }}
      - name: Save build identity and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-build-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/api-source-evidence.json
            ${{ runner.temp }}/api-build-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary registry authentication
        if: always()
        # Keep builder state until setup-buildx-action completes its post cleanup.
        run: rm -f "$DOCKER_CONFIG/config.json"

  staging:
    name: Deploy and verify staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: railway-staging
    permissions:
      contents: read
      actions: read
    env:
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      IMAGE_REPOSITORY: ${{ needs.build.outputs.image-repository }}
      EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
      EXPECTED_SOURCE_TREE: ${{ needs.build.outputs.source-tree }}
      SOURCE_CI_RUN_ID: ${{ needs.build.outputs.source-ci-run-id }}
      SOURCE_BUILD_RUN_ID: ${{ github.run_id }}
      RAILWAY_PROJECT_ID: bec9984e-3e3a-48c8-9d75-8c87d591b931
      RAILWAY_SERVICE_ID: 6cee295e-b8b0-458e-afbe-7093c6e17572
      RAILWAY_ENVIRONMENT_ID: 53c93c9d-33e7-4137-a598-6648a6491886
      STAGING_ENVIRONMENT_ID: 53c93c9d-33e7-4137-a598-6648a6491886
      PRODUCTION_ENVIRONMENT_ID: 72a66cb9-3fc8-4c61-979a-56435cd20e8a
      API_HEALTH_URL: https://api-staging-6ee9.up.railway.app/health
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Deploy digest and validate staging
        run: node scripts/deploy/promote-api-image.cjs staging
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/api-staging-evidence.json
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      - name: Save staging verification and rollback identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-staging-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/api-staging-evidence.json
          if-no-files-found: warn
          retention-days: 30

  production:
    name: Promote verified digest to production
    needs: [build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: railway-production
    permissions:
      contents: read
      actions: read
    env:
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      IMAGE_REPOSITORY: ${{ needs.build.outputs.image-repository }}
      EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
      EXPECTED_SOURCE_TREE: ${{ needs.build.outputs.source-tree }}
      SOURCE_CI_RUN_ID: ${{ needs.build.outputs.source-ci-run-id }}
      SOURCE_BUILD_RUN_ID: ${{ github.run_id }}
      RAILWAY_PROJECT_ID: bec9984e-3e3a-48c8-9d75-8c87d591b931
      RAILWAY_SERVICE_ID: 6cee295e-b8b0-458e-afbe-7093c6e17572
      RAILWAY_ENVIRONMENT_ID: 72a66cb9-3fc8-4c61-979a-56435cd20e8a
      STAGING_ENVIRONMENT_ID: 53c93c9d-33e7-4137-a598-6648a6491886
      PRODUCTION_ENVIRONMENT_ID: 72a66cb9-3fc8-4c61-979a-56435cd20e8a
      API_HEALTH_URL: https://api-production-0856.up.railway.app/health
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Load staging proof from this workflow only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-staging-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-evidence
      - name: Promote the same verified digest
        id: promote
        run: node scripts/deploy/promote-api-image.cjs production
        env:
          STAGING_EVIDENCE_PATH: ${{ runner.temp }}/staging-evidence/api-staging-evidence.json
          EVIDENCE_PATH: ${{ runner.temp }}/api-production-evidence.json
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ALLOW_INITIAL_GIT_SOURCE: ${{ inputs.allow_initial_git_source && 'true' || 'false' }}
      - name: Recover previous verified image after a failed production deployment
        if: failure() && steps.promote.outcome == 'failure'
        run: node scripts/deploy/recover-api-image.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ROLLBACK_ENVIRONMENT: production
          ROLLBACK_EVIDENCE_PATH: ${{ runner.temp }}/api-production-evidence.json
          EVIDENCE_PATH: ${{ runner.temp }}/api-production-rollback-evidence.json
      - name: Save production verification and rollback identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-production-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/api-production-evidence.json
            ${{ runner.temp }}/api-production-rollback-evidence.json
          if-no-files-found: warn
          retention-days: 30
