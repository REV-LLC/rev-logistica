name: CI

on:
  pull_request:
    branches:
      - dev
      - production
  push:
    branches:
      - dev
      - production

jobs:
  build:
    name: Build API and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace apps/api exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rev_logistica

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Test API inventory and document regressions
        run: npm --workspace apps/api test -- --runInBand

      - name: Build Web
        run: npm --workspace apps/web run build

  web-regressions:
    name: Web request regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # These existing node:test files import TypeScript source directly.
          # Keep the application build runtime unchanged in the build job.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web test
